name: Build & Publish Wheels

on:
  push:
    tags:
      - "[0-9]*"       # version tags pushed by release.yml, e.g. 3.0.1
  workflow_dispatch:   # allow manual runs from the Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Binary wheels ────────────────────────────────────────────────────────────
  build-wheels:
    name: Wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04        # Linux x86_64  (native)
          - ubuntu-24.04-arm    # Linux aarch64 (native — no QEMU)
          - macos-14            # macOS arm64   (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD_VERBOSITY: 1
          # Publish CPython 3.10–3.15 only. 3.9 and older are not built.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "pp* *i686* cp36-* cp37-* cp38-* cp39-*"

      # cibuildwheel silently skips build identifiers it does not know, so a
      # too-old pin would drop the newest Python without any error.  Fail the
      # job instead.
      - name: Verify every supported CPython produced a wheel
        shell: bash
        run: |
          set -e
          for tag in cp310 cp311 cp312 cp313 cp314 cp315; do
            if ! ls wheelhouse/*-${tag}-${tag}-*.whl >/dev/null 2>&1; then
              echo "::error::no ${tag} wheel was built (is the cibuildwheel pin new enough for ${tag}?)"
              exit 1
            fi
          done
          ls -1 wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # ── Source distribution ──────────────────────────────────────────────────────
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to PyPI ──────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    # Only publish on a real version tag, not on manual workflow_dispatch
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/daffi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
