site_name: Daffi
site_url: https://600apples.github.io/daffi/
site_dir: mkdocs_files
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - Documentation:
      - Direct topology (Service): usage/service.md
      - Router and workers: usage/router.md
      - Communication patterns: usage/call-styles.md
      - Serialization: usage/serialization.md
      - Callbacks and concurrency: usage/callbacks.md
      - Native runtime: usage/runtime.md
      - Transports: usage/transports.md
      - Event handlers: usage/events.md
      - Security: usage/tls.md
      - Async interface: usage/aio.md

plugins:
  - search
  - section-index

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
